<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caselberg Studio — Email Signature</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: #f5f4f1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      background: #fff;
      border: 1px solid #e0ddd8;
      border-radius: 4px;
      width: 100%;
      max-width: 480px;
      overflow: hidden;
    }

    .card-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid #e0ddd8;
    }

    .card-header h1 {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #999;
    }

    .card-header p {
      font-size: 13px;
      color: #444;
      margin-top: 4px;
      line-height: 1.5;
    }

    .preview-area {
      padding: 28px 24px;
      background: #faf9f7;
      border-bottom: 1px solid #e0ddd8;
    }

    .preview-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #bbb;
      margin-bottom: 16px;
    }

    .signature-preview {
      font-family: Helvetica, Arial, sans-serif;
      font-size: 11px;
      color: #000000;
      line-height: 1.6;
    }

    .signature-preview .logo-wrap {
      margin-bottom: 10px;
    }

    .signature-preview .logo-wrap a {
      display: inline-block;
      text-decoration: none;
    }

    .signature-preview .logo-wrap img {
      display: block;
      height: 20px;
      border: 0;
    }

    .signature-preview .name-line {
      font-weight: 600;
      margin-bottom: 1px;
      color: #000000;
    }

    .signature-preview .contact-line {
      color: #000000;
    }

    .signature-preview .contact-line a {
      color: #000000;
      text-decoration: none;
    }

    .card-footer {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .instructions {
      font-size: 12px;
      color: #999;
      line-height: 1.4;
    }

    .instructions strong {
      color: #555;
      font-weight: 500;
    }

    .copy-btn {
      flex-shrink: 0;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 3px;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      padding: 10px 20px;
      cursor: pointer;
      transition: background 0.15s ease;
      white-space: nowrap;
    }

    .copy-btn:hover { background: #333; }
    .copy-btn.copied { background: #2d6a2d; }
  </style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <h1>Email Signature</h1>
    <p>Copy and paste directly into Gmail's signature field.</p>
  </div>

  <div class="preview-area">
    <div class="preview-label">Preview</div>
    <div class="signature-preview">
      <div class="logo-wrap">
        <a href="https://caselbergstudio.com" target="_blank">
          <img src="https://caselbergstudio.com/logo.png" alt="Caselberg Studio" height="20" />
        </a>
      </div>
      <div class="name-line">Isabella Caselberg &nbsp;|&nbsp; Director</div>
      <div class="contact-line">
        <a href="tel:+64212499499">+64 21 249 9499</a>
        &nbsp;|&nbsp;
        <a href="https://caselbergstudio.com" target="_blank">caselbergstudio.com</a>
      </div>
    </div>
  </div>

  <div class="card-footer">
    <div class="instructions">
      In Gmail: <strong>Settings → See all settings → Signature</strong>, then paste into the editor.
    </div>
    <button class="copy-btn" id="copyBtn" onclick="copySignature()">Copy Signature</button>
  </div>
</div>

<script>
  const signatureHTML = `<table cellpadding="0" cellspacing="0" border="0" style="font-family:Helvetica,Arial,sans-serif;font-size:11px;color:#000000;line-height:1.6;"><tr><td style="padding-bottom:10px;"><a href="https://caselbergstudio.com" target="_blank" style="display:inline-block;text-decoration:none;"><img src="https://caselbergstudio.com/logo.png" alt="Caselberg Studio" height="20" style="display:block;border:0;" /></a></td></tr><tr><td style="font-weight:600;padding-bottom:1px;color:#000000;">Isabella Caselberg &nbsp;|&nbsp; Director</td></tr><tr><td style="color:#000000;"><a href="tel:+64212499499" style="color:#000000;text-decoration:none;">+64 21 249 9499</a>&nbsp;|&nbsp;<a href="https://caselbergstudio.com" target="_blank" style="color:#000000;text-decoration:none;">caselbergstudio.com</a></td></tr></table>`;

  function copySignature() {
    const btn = document.getElementById('copyBtn');

    function markCopied() {
      btn.textContent = 'Copied ✓';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = 'Copy Signature';
        btn.classList.remove('copied');
      }, 2500);
    }

    function execCommandFallback() {
      const el = document.createElement('div');
      el.innerHTML = signatureHTML;
      el.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0;pointer-events:none;';
      document.body.appendChild(el);

      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);

      try {
        document.execCommand('copy');
        markCopied();
      } catch (e) {
        btn.textContent = 'Copy failed – try manually';
      }

      sel.removeAllRanges();
      document.body.removeChild(el);
    }

    if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
      const blob = new Blob([signatureHTML], { type: 'text/html' });
      const item = new ClipboardItem({ 'text/html': blob });
      navigator.clipboard.write([item]).then(markCopied).catch(execCommandFallback);
    } else {
      execCommandFallback();
    }
  }
</script>

</body>
</html>
