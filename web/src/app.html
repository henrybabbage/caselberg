<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta
			name="description"
			content="At the intersection of creativity and innovation, Caselberg Studio uses an integrated approach to ensure creative excellence and business strategy work in harmony."
		/>
		<meta name="author" content="Isabella Caselberg" />
		<meta property="og:site_name" content="Caselberg Studio" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Caselberg Studio" />
		<meta
			property="og:description"
			content="At the intersection of creativity and innovation, Caselberg Studio uses an integrated approach to ensure creative excellence and business strategy work in harmony."
		/>
		<meta name="twitter:title" content="Caselberg Studio" />
		<meta
			name="twitter:description"
			content="At the intersection of creativity and innovation, Caselberg Studio uses an integrated approach to ensure creative excellence and business strategy work in harmony."
		/>
		<style>
			/* Pre-paint splash backdrop: covers the page from the first frame so the
			   site never flashes before the splash component mounts. Removed by the
			   inline script below (already-seen sessions) or by SplashScreen on mount. */
			#splash-backdrop {
				position: fixed;
				inset: 0;
				z-index: 90;
				background: #d40f0f;
			}
		</style>
		<noscript>
			<style>
				#splash-backdrop {
					display: none;
				}
			</style>
		</noscript>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="splash-backdrop"></div>
		<script>
			// Runs synchronously before paint: if the splash has already been seen this
			// session, remove the backdrop immediately so the site shows with no delay.
			try {
				if (sessionStorage.getItem('caselberg:splash-seen')) {
					document.getElementById('splash-backdrop').remove();
				}
			} catch (e) {}
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
